# SPDX-License-Identifier: MIT OR Apache-2.0
name: Publish Linux Packages

# Publishes the Linux packages from one Packaging run to zTop's signed apt repository at
# downloads.bristleconeit.com/ztop/apt/, so installed copies update with `apt upgrade`. Run it
# by hand from Actions, from main, with the number of the Packaging run whose ztop-linux-amd64
# and ztop-linux-arm64 artifacts to publish.
#
# It also publishes the links that always name the newest build, for the one-line installer
# (packaging/linux/install.sh, served as ztop/install.sh):
#   ztop/linux/ztop_latest_<arch>.deb (and .sha256)   replaced by each release, never cached
#   ztop/install.sh                                      curl -fsSL .../ztop/install.sh | sh
#
# With dry_run, it builds and signs the repository and checks it, then keeps it as an artifact
# (with the signing key's public half) and uploads nothing. With links_only, it publishes only
# the latest links and the installer, for a run whose packages are already in the pool.
#
# Packages in the pool are never replaced (the downloads site caches them), so a fix is always
# a new build. The repository's index lists only the packages published by the latest run.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Packaging run whose ztop-linux-amd64 and ztop-linux-arm64 artifacts to publish (from the run's URL)"
        required: true
      dry_run:
        description: "Build, sign, and check the repository, but upload nothing"
        type: boolean
        default: false
      allow_branch:
        description: "Allow a build that isn't from main (testing only)"
        type: boolean
        default: false
      links_only:
        description: "Publish only the latest links and the installer, for packages already published"
        type: boolean
        default: false

concurrency:
  group: publish-linux
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  BASE_URL: https://downloads.bristleconeit.com/ztop/apt/
  PREFIX: ztop/apt/
  SITE_URL: https://downloads.bristleconeit.com/ztop/
  SITE_PREFIX: ztop/

jobs:
  publish:
    runs-on: ubuntu-latest
    # The signing key and the downloads site's credentials are secrets of this environment,
    # which only main can deploy to.
    environment: apt-publish
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      # R2 takes the checksums S3 asks for only when an operation needs them.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      BUCKET: ${{ secrets.R2_BUCKET }}
      DRY_RUN: ${{ inputs.dry_run }}
      LINKS_ONLY: ${{ inputs.links_only }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Check the Packaging run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ALLOW_BRANCH: ${{ inputs.allow_branch }}
        run: |
          read -r BRANCH CONCLUSION WORKFLOW < <(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch,conclusion,workflowName -q '"\(.headBranch) \(.conclusion) \(.workflowName)"')
          echo "Run $RUN_ID: $WORKFLOW, $BRANCH, $CONCLUSION"
          [ "$WORKFLOW" = "Packaging" ] || { echo "::error::Run $RUN_ID is $WORKFLOW, not Packaging"; exit 1; }
          [ "$CONCLUSION" = "success" ] || { echo "::error::Run $RUN_ID didn't succeed"; exit 1; }
          if [ "$BRANCH" != "main" ] && [ "$ALLOW_BRANCH" != "true" ]; then
            echo "::error::Run $RUN_ID built $BRANCH, not main"; exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ztop-linux-*
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Install apt-ftparchive
        run: |
          command -v apt-ftparchive >/dev/null || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq apt-utils; }
      - name: Load the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          [ -n "$APT_SIGNING_KEY" ] || { echo "::error::No APT_SIGNING_KEY secret (the Bristlecone IT Services apt signing key's signing subkey)"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --import <<<"$APT_SIGNING_KEY" 2>&1 | grep -v '^gpg: key .*: secret key imported' || true
          FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          [ -n "$FPR" ] || { echo "::error::APT_SIGNING_KEY holds no secret key"; exit 1; }
          echo "FPR=$FPR" >> "$GITHUB_ENV"
          echo "Signing key $FPR"
          mkdir -p key && gpg --armor --export "$FPR" > key/ztop-archive-keyring.asc
          if [ -f packaging/linux/ztop-archive-keyring.asc ]; then
            WANT="$(gpg --show-keys --with-colons packaging/linux/ztop-archive-keyring.asc | awk -F: '/^fpr/{print $10; exit}')"
            [ "$WANT" = "$FPR" ] || { echo "::error::The key in APT_SIGNING_KEY ($FPR) isn't the one the packages trust ($WANT)"; exit 1; }
          elif [ "$DRY_RUN" != "true" ]; then
            echo "::error::packaging/linux/ztop-archive-keyring.asc isn't committed, so installed packages couldn't verify the repository"; exit 1
          fi
      - name: Check the packages
        run: |
          cd dist
          ls -l
          for arch in amd64 arm64; do
            [ "$(ls ztop_*_"$arch".deb 2>/dev/null | wc -l)" = 1 ] || { echo "::error::Expected one $arch package"; exit 1; }
          done
          sha256sum -c ./*.sha256
          for deb in ztop_*.deb; do
            if ! dpkg-deb -c "$deb" | grep -q './etc/apt/sources.list.d/ztop.sources'; then
              if [ "$DRY_RUN" = "true" ]; then echo "::warning::$deb doesn't add the apt repository"
              else echo "::error::$deb doesn't add the apt repository, so it would never update"; exit 1; fi
            fi
          done
      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          packaging/build-apt-repo.sh --out repo --key-id "$FPR" dist/ztop_*.deb
          for deb in dist/ztop_*.deb; do cp "$deb.sha256" repo/pool/main/z/ztop/; done
          # For people who add the repository by hand.
          cp key/ztop-archive-keyring.asc repo/
          # The signature apt will check, with the public key the packages carry.
          gpg --dearmor < key/ztop-archive-keyring.asc > "$RUNNER_TEMP/keyring.gpg"
          gpgv --keyring "$RUNNER_TEMP/keyring.gpg" repo/dists/stable/InRelease
          gpgv --keyring "$RUNNER_TEMP/keyring.gpg" repo/dists/stable/Release.gpg repo/dists/stable/Release
          find repo -type f | sort
      - name: Lay out the latest links and the installer
        run: |
          sh -n packaging/linux/install.sh
          mkdir -p site/linux
          cp packaging/linux/install.sh site/install.sh
          for deb in dist/ztop_*.deb; do
            arch="$(dpkg-deb -f "$deb" Architecture)"
            cp "$deb" "site/linux/ztop_latest_$arch.deb"
            cp "$deb.sha256" "site/linux/ztop_latest_$arch.deb.sha256"
          done
          (cd site/linux && for f in *.deb; do [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$f.sha256")" ] || { echo "::error::$f doesn't match its checksum"; exit 1; }; done)
          find site -type f | sort
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.dry_run
        with:
          name: apt-repository-dry-run
          path: |
            repo
            key
            site
          retention-days: 7
      - name: Check the credentials and the bucket
        if: ${{ !inputs.dry_run }}
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ENDPOINT BUCKET; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET)"; exit 1; }
          done
          command -v aws >/dev/null || { echo "::error::No aws CLI on this runner"; exit 1; }
          cd repo
          for deb in pool/main/z/ztop/*.deb; do
            if [ "$LINKS_ONLY" = "true" ]; then
              # The latest links must name packages apt can already install from the repository.
              GOT="$(curl -fsS "${BASE_URL}${deb}" | sha256sum | cut -d' ' -f1)" || { echo "::error::${PREFIX}${deb} isn't published, so it can't be the latest"; exit 1; }
              [ "$GOT" = "$(cut -d' ' -f1 "${deb}.sha256")" ] || { echo "::error::The published ${deb} isn't this run's build"; exit 1; }
              echo "${deb} is published"
            elif aws s3api --endpoint-url "$ENDPOINT" head-object --bucket "$BUCKET" --key "${PREFIX}${deb}" >/dev/null 2>&1; then
              echo "::error::${PREFIX}${deb} is already published; publish a new build instead"; exit 1
            fi
          done
      - name: Upload the packages, then the indexes, then the signed Release last
        if: ${{ !inputs.dry_run && !inputs.links_only }}
        run: |
          cd repo
          put() { aws s3api --endpoint-url "$ENDPOINT" put-object --bucket "$BUCKET" --key "${PREFIX}$1" --body "$1" --content-type "$2" --cache-control "$3" >/dev/null; echo "Uploaded ${PREFIX}$1"; }
          immutable="public, max-age=31536000, immutable"
          for f in pool/main/z/ztop/*.deb; do put "$f" application/vnd.debian.binary-package "$immutable"; done
          for f in pool/main/z/ztop/*.sha256; do put "$f" text/plain "$immutable"; done
          for f in dists/stable/main/binary-*/by-hash/SHA256/*; do put "$f" application/octet-stream "$immutable"; done
          for f in dists/stable/main/binary-*/Packages dists/stable/main/binary-*/Packages.gz; do put "$f" application/octet-stream no-cache; done
          put ztop-archive-keyring.asc application/pgp-keys no-cache
          put dists/stable/Release text/plain no-cache
          put dists/stable/Release.gpg application/pgp-signature no-cache
          put dists/stable/InRelease text/plain no-cache
      - name: Upload the latest links, then the installer
        if: ${{ !inputs.dry_run }}
        run: |
          cd site
          put() { aws s3api --endpoint-url "$ENDPOINT" put-object --bucket "$BUCKET" --key "${SITE_PREFIX}$1" --body "$1" --content-type "$2" --cache-control no-cache >/dev/null; echo "Uploaded ${SITE_PREFIX}$1"; }
          for f in linux/*.deb; do put "$f" application/vnd.debian.binary-package; put "$f.sha256" text/plain; done
          put install.sh text/plain
      - name: Check the latest links and the installer
        if: ${{ !inputs.dry_run }}
        run: |
          cd site
          for f in linux/*.deb linux/*.sha256 install.sh; do
            GOT="$(curl -fsS "${SITE_URL}${f}?fresh=$(date +%s)" | sha256sum | cut -d' ' -f1)"
            WANT="$(sha256sum "$f" | cut -d' ' -f1)"
            [ "$GOT" = "$WANT" ] || { echo "::error::${SITE_URL}${f} ($GOT) isn't what was uploaded ($WANT)"; exit 1; }
            echo "${SITE_URL}${f} matches"
          done
          curl -fsSI "${SITE_URL}install.sh" | grep -i '^cache-control: no-cache' >/dev/null \
            || echo "::warning::${SITE_URL}install.sh isn't served with Cache-Control: no-cache"
      - name: Check what apt will see
        if: ${{ !inputs.dry_run && !inputs.links_only }}
        run: |
          curl -fsS "${BASE_URL}dists/stable/InRelease?fresh=$(date +%s)" -o public-InRelease
          gpgv --keyring "$RUNNER_TEMP/keyring.gpg" public-InRelease
          cmp -s public-InRelease repo/dists/stable/InRelease || echo "::warning::The downloads site still serves an older InRelease (cached); apt sees this release once that expires"
          cd repo
          for deb in pool/main/z/ztop/*.deb; do
            GOT="$(curl -fsS "${BASE_URL}${deb}" | sha256sum | cut -d' ' -f1)"
            WANT="$(cut -d' ' -f1 "${deb}.sha256")"
            [ "$GOT" = "$WANT" ] || { echo "::error::The published ${deb} ($GOT) isn't what was built ($WANT)"; exit 1; }
            echo "${BASE_URL}${deb} matches: $GOT"
          done
