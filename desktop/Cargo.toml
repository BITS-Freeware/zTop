# SPDX-License-Identifier: MIT OR Apache-2.0
# The zTop Linux desktop app (decision 0065), a workspace of its own so
# that building the terminal monitor never needs GTK. It speaks to agents
# and hubs through this repository's own client, `ztop-core`, so the
# protocol, pairing and pinning are never copied.
[workspace]
resolver = "3"
members = ["crates/desktop-core", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
publish = false

[workspace.dependencies]
ztop-core = { path = "../crates/core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# Bonjour browsing, the same crate and version the agent advertises with.
mdns-sd = "0.21.7"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
libsecret = { version = "0.9", features = ["v0_21"] }

[profile.release]
lto = "thin"
codegen-units = 1
